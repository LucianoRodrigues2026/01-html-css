<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>grid-layout</title>
  <style>
    * {
      color: #14aac1;
    }
    .conteiner {
      padding: 10px;
      border: 5px solid blue; 
      display: grid;
      grid-template: repeat(4,100px)  / repeat(4, 1fr) ;
      grid-auto-flow: row;
      grid-auto-rows: 100px;
      grid-auto-columns: 1fr;
      gap: 5px;

    }
    .caixa1 {   
      display: flex;
      justify-content: start;
      align-items: center;
      
      background-color: #1d2301; 
      text-align: center;
      border: 5px solid #1d2301;



      grid-area: 1 / 1 / 2 / 5;
    }
    .caixa2 {
      display: flex;
      justify-content: end;
      align-items: end;

      background-color: #051f02;
      text-align: center;
      border: 5px solid #051f02;

      grid-area: 2 / 1 / 4 / 3;
    }
    .caixa3 {
      display: flex;
      justify-content: end;
      align-items: center;

      background-color: #2b3a0c;
      text-align: center;
      border: 5px solid #2b3a0c;
      
    
      grid-area: 2 / 3 / 4 / 5;
    }
    .caixa4 {
      display: flex;
      justify-content: center;
      align-items: center;
      
      background-color: #1a417b;
      border: 5px solid #1a417b;
      
    
      grid-area: 4 / 1 / 4 / span 4;
    }

  </style>
</head>
<body>
  <div class="conteiner">
    <!--div feita com alt-->
    <div class="caixa1">caixa1</div>
    <div class="caixa2">caixa2</div>
    <div class="caixa3">caixa3</div>
    <div class="caixa4">caixa4</div>
  </div>
  
</body>
</html>
