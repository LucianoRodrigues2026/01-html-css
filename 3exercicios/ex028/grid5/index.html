<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>grid-layout</title>
  <style>
    .conteiner {
      padding: 10px;
      border: 5px solid blue; 
      display: grid;
      grid-template: repeat(3,100px)  / repeat(4, 1fr) ;
      grid-auto-flow: row;
      grid-auto-rows: 100px;
      grid-auto-columns: 1fr;
      gap: 15px;

    }
    .caixa1 {    
      background-color: #506302; 
      text-align: center;
      border: 5px solid #506302;

      grid-row: 1 / 2;
      grid-column: 1 / span 4;
    }
    .caixa2 {
      background-color: #051f02;
      text-align: center;
      border: 5px solid #051f02;

      grid-row: 2 / 4;
      grid-column: 1 / span 2;
    }
    .caixa3 {
      background-color: #aaff00;
      text-align: center;
      border: 5px solid #aaff00;
      
      grid-row: 2 / span 2;
      grid-column-start: 3;
      grid-column-end: 5;
      grid-column: 3/ span 2;
    }

  </style>
</head>
<body>
  <div class="conteiner">
    <!--div feita com alt-->
    <div class="caixa1">caixa1</div>
    <div class="caixa2">caixa2</div>
    <div class="caixa3">caixa3</div>
  </div>
  
</body>
</html>
