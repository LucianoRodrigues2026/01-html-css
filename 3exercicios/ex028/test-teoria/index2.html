<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>grid-layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    .conteiner {
      width: 100vw;
      height: 100vh;
      display: grid;
      grid-template-rows: repeat(7, 100px);
      grid-template-columns: repeat(6, 1fr);
    }
    .teto {
      border: 1px solid black;
      background-color: rgb(38, 124, 124);
      grid-row-start: 1;
      grid-row-end: 3;
      grid-column-start: 1;
      grid-column-end: 7;
    }
    .menu {
      background-color: rgb(60, 74, 74);
      grid-row-start: 3;
      grid-row-end: 7;
      grid-column-start: 1;
      grid-column-end: 2;

    }
    .conteudo {
      background-color: rgb(4, 107, 43);
      grid-row-start: 3;
      grid-row-end: 7;
      grid-column-start: 2;
      grid-column-end: 6;
    }
    .anuncio {
      background-color: aqua;
      grid-row-start: 3;
      grid-row-end: 7;
      grid-column-start: 6;
      grid-column-end: -2;
    }

    .rodape {
      background-color: rgb(39, 53, 53);
      grid-row-start: 7;
      grid-row-end: 7;
      grid-column-start: 1;
      grid-column-end: 7;
    }
  </style>
</head>
<body>
  <div class="conteiner">
    <div class="teto"></div>
    <div class="menu"></div>
    <div class="conteudo"></div>
    <div class="anuncio"></div>
    <div class="rodape"></div>
  </div>
</body>
</html>
